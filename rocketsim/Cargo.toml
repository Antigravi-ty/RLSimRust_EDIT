[package]
name = "rocketsim"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "RocketSim v3-rust physics engine core with WebAssembly C-ABI extensions"

[dependencies]
bitflags = "2.11.0"
fastrand = "2.3.0"
glam = { version = "0.32.0", features = ["core-simd"] }
indexmap = "2.13.0"
log = "0.4.29"
planus = { version = "1.2.0", optional = true }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
smallvec = { version = "1.15.1", features = ["const_generics", "union"] }

[features]
default = []
serde = ["dep:serde", "glam/serde", "indexmap/serde", "smallvec/serde", "bitflags/serde"]
rlbot = ["dep:planus"]
