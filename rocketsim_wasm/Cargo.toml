[package]
name = "rocketsim_wasm"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "Zero-Emscripten WebAssembly C-ABI bridge for RocketSim v3-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = { version = "0.32.0", features = ["core-simd"] }
rocketsim = { path = "../rocketsim" }
